<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>성심교회 아동부</title>
  <meta name="theme-color" content="#49392D">
  <meta name="application-name" content="성심교회 아동부">
  <meta name="apple-mobile-web-app-title" content="성심교회 아동부">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json?v=20260825-1">
  <link rel="icon" type="image/svg+xml" href="icon.svg?v=20260825-1">
  <link rel="shortcut icon" type="image/svg+xml" href="icon.svg?v=20260825-1">
  <link rel="apple-touch-icon" href="icon.svg?v=20260825-1">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f3f5f7;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#15212a;padding:18px;display:flex;justify-content:center;align-items:flex-start}
    .card{width:min(94vw,430px);background:#fff;border-radius:24px;padding:24px 20px;box-shadow:0 12px 40px rgba(0,0,0,.10);text-align:center}
    .logo{width:128px;height:128px;border-radius:28px;display:block;margin:0 auto 16px}
    h1{font-size:24px;margin:0 0 8px}
    p{font-size:14px;line-height:1.65;color:#66737d;margin:0 0 18px}
    .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;text-decoration:none;cursor:pointer;margin:0 0 10px}
    .install{display:none;background:#49392D;color:#fff}
    .help{background:#eee9e5;color:#49392D}
    .open{background:#19506f;color:#fff}
    .guide{display:none;margin-top:14px;padding:15px;border:1px solid #ead6bf;border-radius:14px;background:#fff7ed;color:#584536;text-align:left;font-size:13px;line-height:1.7}
    .guide.show{display:block}
    .guide b{color:#35271f}
    .status{margin-top:12px;font-size:12px;line-height:1.5;color:#6c7881}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="icon.svg?v=20260825-1" alt="성심교회 로고">
    <h1>성심교회 아동부</h1>
    <p>성심교회 로고 아이콘으로 홈 화면에 추가할 수 있습니다.</p>

    <button id="installBtn" class="btn install">성심교회 아동부 앱 설치</button>
    <button id="helpBtn" class="btn help">홈 화면에 추가 방법</button>
    <a class="btn open" href="https://script.google.com/macros/s/AKfycbxFR4Lmd9HeaHgmXaRHFbTblzH-X6X7RGwEPjIYTcwTZhjCl5ajlgZVclpRcDUdOdoB/exec">아동부 앱 열기</a>

    <div id="guide" class="guide"></div>
    <div id="status" class="status">설치 정보를 확인 중입니다.</div>
  </main>
<script>
const APP_URL='https://script.google.com/macros/s/AKfycbxFR4Lmd9HeaHgmXaRHFbTblzH-X6X7RGwEPjIYTcwTZhjCl5ajlgZVclpRcDUdOdoB/exec';
const installBtn=document.getElementById('installBtn');
const helpBtn=document.getElementById('helpBtn');
const guide=document.getElementById('guide');
const statusEl=document.getElementById('status');
let deferredPrompt=null;

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js?v=20260825-1',{scope:'./'})
    .then(()=>navigator.serviceWorker.ready)
    .then(()=>{statusEl.textContent='준비 완료. 설치 버튼이 보이면 설치를 누르고, 안 보이면 홈 화면에 추가 방법을 이용해주세요.';})
    .catch(()=>{statusEl.textContent='홈 화면에 추가 방법 버튼을 이용해주세요.';});
}

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  installBtn.style.display='block';
  statusEl.textContent='이 휴대폰은 앱 형태로 설치할 수 있습니다.';
});

installBtn.addEventListener('click',async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  installBtn.style.display='none';
});

helpBtn.addEventListener('click',()=>{
  const ua=navigator.userAgent||'';
  const samsung=/SamsungBrowser/i.test(ua);
  const chrome=/Chrome/i.test(ua)&&!samsung;
  if(samsung){
    guide.innerHTML='<b>삼성인터넷</b><br>오른쪽 아래 메뉴(≡ 또는 ⋮) → <b>현재 페이지 추가</b> → <b>홈 화면</b>을 선택하세요.<br><br>추가 화면에 성심교회 로고가 보이는지 확인한 뒤 추가하면 됩니다.';
  }else if(chrome){
    guide.innerHTML='<b>Chrome</b><br>오른쪽 위 ⋮ → <b>홈 화면에 추가</b>를 선택하세요.<br><br>추가 화면에 성심교회 로고가 보이는지 확인한 뒤 추가하면 됩니다.';
  }else{
    guide.innerHTML='이 주소를 <b>삼성인터넷 또는 Chrome</b>으로 직접 열고 브라우저 메뉴의 <b>홈 화면에 추가</b> 기능을 사용하세요.';
  }
  guide.classList.toggle('show');
});

window.addEventListener('appinstalled',()=>{
  statusEl.textContent='성심교회 아동부 앱 설치가 완료되었습니다.';
  installBtn.style.display='none';
});

const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
if(standalone){window.location.replace(APP_URL);}
</script>
</body>
</html>
